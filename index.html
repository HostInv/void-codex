<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="Void Codex — цифровой мир фракций, правил и историй."
    />

    <meta name="theme-color" content="#050606" />

    <title>VOID CODEX — Главная</title>

    <!-- ===== ОБЩИЕ СТИЛИ САЙТА ===== -->
    <link rel="stylesheet" href="./Shared/styles/global.css" />
    <link rel="stylesheet" href="./Menu/mstyles/menu.css" />

    <!-- ===== ГЛАВНЫЙ ЗАГРУЗЧИК ===== -->
    <script src="./Shared/scripts/background.js" defer></script>
    <script src="./Menu/mscripts/digital-rain.js" defer></script>
  </head>

  <body>
    <!-- ===== ФОНОВАЯ АРХИТЕКТУРА ===== -->
    <div class="world-background" aria-hidden="true">
      <div class="grid-floor"></div>
      <div class="architecture architecture-left"></div>
      <div class="architecture architecture-right"></div>
      <div class="distant-city"></div>
      <div class="portal"></div>
    </div>

    <!-- ===== ГЛАВНЫЙ ЭКРАН ===== -->
    <main class="main-screen">
      <header class="brand">
        <div class="brand-symbol" aria-hidden="true">
          <img src="./images/VC.png" alt="VOID CODEX" />
        </div>

        <h1 class="brand-title">
          <span class="brand-void">VOID</span>
          <span class="brand-codex">CODEX</span>
        </h1>

        <div class="tagline">
          <span class="tagline-line"></span>
          <p>ЗА ПРЕДЕЛАМИ ИЗВЕСТНОГО</p>
          <span class="tagline-line"></span>
        </div>
      </header>

      <!-- ===== ГЛАВНАЯ НАВИГАЦИЯ ===== -->
      <nav class="main-menu" aria-label="Главное меню">
        <a class="menu-button" href="./Welcome/">
          <svg
            class="button-frame"
            viewBox="0 0 440 68"
            preserveAspectRatio="none"
            aria-hidden="true"
          >
            <path d="M18 1 H422 L439 34 L422 67 H18 L1 34 Z" />
          </svg>

          <span class="button-number">01</span>
          <span class="button-label">Вступление (и Помощь)</span>
          <span class="button-arrow" aria-hidden="true">›</span>
        </a>

        <a class="menu-button" href="../Start/">
          <svg
            class="button-frame"
            viewBox="0 0 440 68"
            preserveAspectRatio="none"
            aria-hidden="true"
          >
            <path d="M18 1 H422 L439 34 L422 67 H18 L1 34 Z" />
          </svg>

          <span class="button-number">02</span>
          <span class="button-label">Начало</span>
          <span class="button-arrow" aria-hidden="true">›</span>
        </a>

        <a class="menu-button" href="../Factions/">
          <svg
            class="button-frame"
            viewBox="0 0 440 68"
            preserveAspectRatio="none"
            aria-hidden="true"
          >
            <path d="M18 1 H422 L439 34 L422 67 H18 L1 34 Z" />
          </svg>

          <span class="button-number">03</span>
          <span class="button-label">Выбор фракций</span>
          <span class="button-arrow" aria-hidden="true">›</span>
        </a>

        <a class="menu-button" href="#rules">
          <svg
            class="button-frame"
            viewBox="0 0 440 68"
            preserveAspectRatio="none"
            aria-hidden="true"
          >
            <path d="M18 1 H422 L439 34 L422 67 H18 L1 34 Z" />
          </svg>

          <span class="button-number">04</span>
          <span class="button-label">Правила</span>
          <span class="button-arrow" aria-hidden="true">›</span>
        </a>

        <a class="menu-button" href="#editors">
          <svg
            class="button-frame"
            viewBox="0 0 440 68"
            preserveAspectRatio="none"
            aria-hidden="true"
          >
            <path d="M18 1 H422 L439 34 L422 67 H18 L1 34 Z" />
          </svg>

          <span class="button-number">05</span>
          <span class="button-label">Редакторы</span>
          <span class="button-arrow" aria-hidden="true">›</span>
        </a>
      </nav>

      <!-- ===== НИЖНЯЯ ПОДПИСЬ ===== -->
      <footer class="site-footer">
        <span class="footer-line"></span>
        <p>Version 26.1.0 Static interface</p>
        <span class="footer-line"></span>
      </footer>
    </main>
  </body>
</html>
