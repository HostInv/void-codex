<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Фронтир — VOID CODEX</title>

    <link rel="stylesheet" href="../../Shared/styles/global.css" />
    <link rel="stylesheet" href="../fstyles/factions.css" />
    <script src="../../Shared/scripts/background.js" defer></script>
  </head>
  <body>
    <div class="world-background" aria-hidden="true"></div>

    <main class="factions-screen">
      <header class="factions-header">
        <p class="factions-overline">VOID CODEX / FACTION ARCHIVE</p>
        <h1 style="color: #d4d9d4">ФРОНТИР</h1>
        <p class="factions-description">
          Чёрно-белый знак. Угловатая форма. Собственный рубеж.
        </p>
      </header>

      <section class="faction-card faction-card--frontier">
        <div class="faction-toggle">
          <span class="faction-emblem" aria-hidden="true">
            <svg viewBox="0 0 100 100">
              <path d="M50 7L84 27V69L50 93L16 69V27Z" />
              <path d="M50 7V93M16 27L84 69M84 27L16 69" />
            </svg>
          </span>
          <span class="faction-heading">
            <span class="faction-name">АРХИВ ФРОНТИРА</span>
            <span class="faction-motto">СТРАНИЦА В РАЗРАБОТКЕ</span>
          </span>
        </div>
        <div class="faction-details">
          <p>
            Здесь появятся история Фронтира, его устройство, материалы фракции и
            другие связанные разделы.
          </p>
        </div>
      </section>

      <nav class="factions-navigation" aria-label="Навигация">
        <a class="factions-back" href="../"> ← К ВЫБОРУ ФРАКЦИИ </a>
      </nav>
    </main>
  </body>
</html>
