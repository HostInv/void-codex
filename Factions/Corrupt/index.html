<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Коррапт — VOID CODEX</title>

    <link rel="stylesheet" href="../../Shared/styles/global.css" />
    <link rel="stylesheet" href="../fstyles/factions.css" />
    <script src="../../Shared/scripts/background.js" defer></script>
  </head>
  <body>
    <div class="world-background" aria-hidden="true"></div>

    <main class="factions-screen">
      <header class="factions-header">
        <p class="factions-overline">VOID CODEX / FACTION ARCHIVE</p>
        <h1 style="color: #ed414b">КОРРАПТ</h1>
        <p class="factions-description">
          Искажённая форма. Красный знак. Непредсказуемость.
        </p>
      </header>

      <section class="faction-card faction-card--corrupt">
        <div class="faction-toggle">
          <span class="faction-emblem" aria-hidden="true">
            <svg viewBox="0 0 100 100">
              <path
                d="M24 36L17 13L39 29L50 25L61 29L83 13L76 36
              C88 48 81 64 69 71L66 90L55 78L50 81L45 78
              L34 90L31 71C19 64 12 48 24 36Z"
              />
              <circle cx="38" cy="48" r="4" />
              <circle cx="62" cy="48" r="4" />
            </svg>
          </span>
          <span class="faction-heading">
            <span class="faction-name">АРХИВ КОРРАПТА</span>
            <span class="faction-motto">СТРАНИЦА В РАЗРАБОТКЕ</span>
          </span>
        </div>
        <div class="faction-details">
          <p>
            Здесь появятся история Коррапта, его устройство, материалы фракции и
            другие связанные разделы.
          </p>
        </div>
      </section>

      <nav class="factions-navigation" aria-label="Навигация">
        <a class="factions-back" href="../"> ← К ВЫБОРУ ФРАКЦИИ </a>
      </nav>
    </main>
  </body>
</html>
